<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self' data: blob:; connect-src 'self'; manifest-src 'self'; worker-src 'self'; base-uri 'none'; form-action 'none'">
  <meta name="theme-color" content="#2563eb">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="口袋记账">

<body>

    <h1>📒 口袋记账</h1>

    <button type="button" data-v="more"><i>⚙️</i>更多</button>
  </nav>
  <div id="toast" role="status" aria-live="polite" hidden></div>
  <noscript><p class="page">需要启用 JavaScript 才能使用记账本。</p></noscript>
  <script type="module" src="js/app.js"></script>
